# AWS 실행 시 사용할 DB·서버 설정입니다. 실제 값은 환경 변수로 받습니다.
# Enable with SPRING_PROFILES_ACTIVE=aws only after creating an RDS MySQL database.
# FOLIO_DB_URL must include the database name and TLS, e.g. jdbc:mysql://HOST:3306/folio?sslMode=VERIFY_IDENTITY
spring.datasource.url=${FOLIO_DB_URL}
spring.datasource.username=${FOLIO_DB_USERNAME}
spring.datasource.password=${FOLIO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax